# Alembic configuration.
#
# Alembic is the tool that creates and applies "migrations" — versioned change
# files that build up the database schema step by step. This file just points
# it at the folder holding those files. The database URL is NOT set here on
# purpose; alembic/env.py reads it from our .env via app.config, so there is
# only ever one source of the connection string.

[alembic]
script_location = alembic
prepend_sys_path = .

# ---- logging (standard boilerplate; controls Alembic's console output) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
